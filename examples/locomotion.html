<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Companion · 传送动画</title>
<style>body{background:#f7f5f1;color:#4e455c;font:15px/1.65 system-ui;margin:24px}body.dark{background:#222530;color:#efe8fa}header,main{max-width:1050px;margin:auto}h1{font-size:28px}button,a{color:inherit;padding:8px 14px;border:1px solid #a899b5;border-radius:9px;background:transparent;cursor:pointer;margin:4px}article{margin:22px 0;padding:16px;border:1px solid #ab9cbb44;border-radius:18px}.stage{position:relative;height:195px;border-bottom:1px dashed #ab9cbb55}.actor{position:absolute;top:12px;width:160px}.target{position:absolute;right:24px;top:80px;color:#a794bb;font-size:24px}.dark .actor{background:radial-gradient(ellipse at 50% 22%,#c8c6ec22,transparent 70%)}small{display:block;color:#8c8098}</style>
<header><h1>一闪，来到你身边。</h1><p>原地化作星屑，在目标位置重新出现。保留原来的脸和身体比例；消失、出现各 12 帧。</p><button id="theme">切换深浅背景</button><a href="./">返回工作室</a></header><main></main>
<script type="module">
import {createCompanion,createCompanionMotion,loadCharacter} from './package/index.js';import './package/register.js';
for(const [id,name] of [['dogegg','狗蛋 Dogegg'],['boniu','波妞 Boniu'],['bolo','波洛 Bolo']]){
 const pack=await loadCharacter(new URL('./assets/'+id+'/character.json',location.href));const card=document.createElement('article');card.innerHTML=`<b>${name}</b><div class="stage"><span class="target">✦</span><div class="actor"></div></div><div class="actions"></div><small>等待素材加载…</small>`;document.querySelector('main').append(card);
 const actor=card.querySelector('.actor'),el=document.createElement('agent-companion'),c=createCompanion(pack);el.setAttribute('size','160');el.controller=c;actor.append(el);
 const driver=createCompanionMotion(c,{position:{x:0,y:0},mode:'teleport',onPosition:p=>actor.style.left=p.x+'px',reducedMotion:()=>matchMedia('(prefers-reduced-motion: reduce)').matches});let right=false,busy=false;
 for(const [label,run] of [['传送',()=>{right=!right;return driver.moveTo({x:right?Math.max(0,card.querySelector('.stage').clientWidth-172):0,y:0})}],['消失',()=>driver.disappear()],['出现',()=>driver.appear()]]){const b=document.createElement('button');b.textContent=label;b.disabled=true;b.onclick=async()=>{if(busy)return;busy=true;card.querySelectorAll('button').forEach(b=>b.disabled=true);try{await run()}finally{busy=false;card.querySelectorAll('button').forEach(b=>b.disabled=false)}};card.querySelector('.actions').append(b)}
 c.on('statechange',e=>card.querySelector('small').textContent=e.reaction);
 el.addEventListener('companion-ready',async()=>{await driver.appear();card.querySelectorAll('button').forEach(b=>b.disabled=false)},{once:true});
}
document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');
</script></html>
