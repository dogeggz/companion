[project]
name = "companion-harness"
version = "0.1.0"
description = "Host-configured linear agent sessions and tool execution for Companion"
requires-python = ">=3.12"
dependencies = ["itsdangerous>=2.2", "jsonschema>=4.23"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["companion_harness"]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
